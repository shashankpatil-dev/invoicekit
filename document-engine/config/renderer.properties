# Engineering settings for the Typst renderer.
# Any value can be overridden by an environment variable, for example
# render.max-waiting becomes RENDER_MAX_WAITING.

# Where fonts and business unit templates live inside the image.
assets.dir=/app/assets

# Rendering is CPU-heavy, so one render at a time per worker uses the CPU fully.
render.slots=1

# How many renders may wait for a slot. Anything beyond this gets a 503.
render.max-waiting=6

# A render running longer than this is treated as stuck, and the worker is replaced.
render.timeout-seconds=30

# How often the watchdog checks for a stuck render.
render.watchdog-interval-seconds=1

# Address the service listens on.
server.bind=0.0.0.0:3000

# Threads per worker. Must exceed render.slots + render.max-waiting, so /health always has a free thread.
server.threads=8

# Backstop that replaces a worker if it stops responding altogether.
server.worker-timeout-seconds=30

# Seconds to keep idle connections open. 0 closes them, so Kubernetes spreads requests evenly.
server.keepalive-seconds=0

# Restart workers after about this many requests to keep memory steady.
server.max-requests=5000
server.max-requests-jitter=500
