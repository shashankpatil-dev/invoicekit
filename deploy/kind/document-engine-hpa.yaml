# Adds pods when average CPU passes 70% of the 1 CPU request, up to the maximum.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document-engine
  namespace: fp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
