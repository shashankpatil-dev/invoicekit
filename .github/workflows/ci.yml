name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Check formatting, build and test
        run: ./gradlew build

      - name: Lint the document engine Helm chart
        run: |
          helm lint deploy/helm/document-engine
          helm lint deploy/helm/document-engine --values deploy/helm/document-engine/values-loadtest.yaml
