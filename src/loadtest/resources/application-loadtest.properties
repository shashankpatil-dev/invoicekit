# TEMPORARY numbering load test profile, used only by build/libs/invoicekit-loadtest.jar.

# Adds the temporary test series (entity TEST_NUMBERING) on top of the real schema.
spring.flyway.locations=classpath:db/migration,classpath:db/testseries

# Connections per app pod. run.sh sets it for each phase, because it caps writers per series.
spring.datasource.hikari.maximum-pool-size=${HIKARI_POOL_SIZE:10}

server.port=8081

# Redis isn't deployed for this test, and numbering doesn't use it, so it mustn't fail readiness.
management.health.redis.enabled=false

# The fake entity and business units from db/testseries, and how each numbers its invoices.
invoicekit.loadtest.entity-code=TEST_NUMBERING
invoicekit.loadtest.number-formats.numbering-test=SUB{shard}{fy}{seq:10}
invoicekit.loadtest.number-formats.numbering-test-sharded=SHD{shard}{fy}{seq:10}
