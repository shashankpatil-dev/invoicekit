# Application name and config imports. Settings live in resources/config, one file per topic.
spring:
  application:
    name: invoicekit
  config:
    import:
      - classpath:config/server.properties
      - classpath:config/database.properties
      - classpath:config/kafka.properties
      - classpath:config/redis.properties
      - classpath:config/storage.properties
      - classpath:config/render.properties
      - classpath:config/jobs.properties
      - classpath:config/notification.properties

---
# Worker profiles run without a web server.
spring:
  config:
    activate:
      on-profile: intake | render | notify | jobs
  main:
    web-application-type: none
    keep-alive: true
