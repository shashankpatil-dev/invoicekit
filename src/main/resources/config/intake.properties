# Turning invoice.requested events into numbered invoices.

# Consumer threads per pod. Pods times threads must stay at or below the 24 partitions of
# invoice.requested, and below the database connection pool size.
invoicekit.intake.concurrency=4

# Waits between retries of an event that failed for a passing reason, such as the database being
# down. The first retry waits the initial interval, each later wait is 1.5 times longer, and no wait
# goes beyond the maximum. Such events are retried until they succeed, never dead-lettered.
invoicekit.intake.retry-initial-interval=200ms
invoicekit.intake.retry-max-interval=30s

# How long each pod keeps entities, adapter configs, states, tax rates and declarations in memory.
# An edit to reference data reaches intake within this time.
invoicekit.intake.reference-cache-ttl=5m

# Largest saved payload in bytes. The invoice.render message carries the payload inline, so this
# keeps it under Kafka's 1MB default message size. Larger events go to the dead-letter topic.
invoicekit.intake.max-payload-bytes=900000
