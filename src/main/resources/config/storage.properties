# Object storage for finished PDFs.

# Address of fake-gcs-server, for local and test runs only. Set STORAGE_ENDPOINT to an empty value
# in deployed environments, so the application uses real Google Cloud Storage with the pod's
# default Google credentials.
invoicekit.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:4443}

# Bucket that holds the PDFs. Required.
invoicekit.storage.bucket=${STORAGE_BUCKET:invoices}

# Invoices older than this move to daily bundles.
invoicekit.archive.older-than-days=90
