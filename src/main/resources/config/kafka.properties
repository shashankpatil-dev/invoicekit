# Kafka connection. Offsets are committed by hand, only after work is safe in PostgreSQL.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual

# Wait for all replicas, and let the broker drop duplicate sends.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
