# Outbox publishing, which moves committed outbox rows to Kafka. See docs/RENDER.md section 4.

# Wait between publishing runs. A run that sends a full batch goes straight on to the next batch,
# so a backlog drains without waiting.
invoicekit.outbox.poll-interval=100ms

# Most rows one publishing transaction claims and sends.
invoicekit.outbox.batch-size=500

# Longest wait for Kafka to acknowledge a batch. Rows not acknowledged in time stay unsent and go
# out in a later run.
invoicekit.outbox.send-timeout=10s

# Sent rows are kept this long for investigation, then deleted.
invoicekit.outbox.retention=24h

# How often cleanup runs, and the most rows each of its delete statements removes.
invoicekit.outbox.cleanup-interval=10m
invoicekit.outbox.cleanup-batch-size=5000

# Recovery cron. Stuck invoices are re-driven with the same number and payload.
invoicekit.recovery.interval=1m
invoicekit.recovery.numbered-stuck-after=5m
invoicekit.recovery.stored-stuck-after=15m
invoicekit.recovery.max-attempts=5
invoicekit.recovery.batch-size=100
