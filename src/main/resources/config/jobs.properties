# Outbox publishing. Mode is polling or cdc.
invoicekit.outbox.mode=polling
invoicekit.outbox.poll-interval=100ms
invoicekit.outbox.batch-size=500

# Recovery cron. Stuck invoices are re-driven with the same number and payload.
invoicekit.recovery.interval=1m
invoicekit.recovery.numbered-stuck-after=5m
invoicekit.recovery.stored-stuck-after=15m
invoicekit.recovery.max-attempts=5
invoicekit.recovery.batch-size=100
