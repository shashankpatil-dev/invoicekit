# Distributed tracing. Spans go to an OpenTelemetry (OTLP) collector, which is Jaeger locally.

# Share of requests that are traced, from 0.0 to 1.0. Every request is traced locally.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}

# Where spans are sent, over OTLP HTTP. This is Jaeger in deploy/compose.
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4320/v1/traces}

# Kafka listeners continue the trace found in each record's headers, and sends add the current
# trace to the records they write, so one trace follows an event through intake and its DLQ publish.
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
