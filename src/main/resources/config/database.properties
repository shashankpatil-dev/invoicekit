# PostgreSQL connection and schema migrations.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/invoicekit}
spring.datasource.username=${DB_USERNAME:invoicekit}
spring.datasource.password=${DB_PASSWORD:invoicekit}
spring.flyway.enabled=true

# How long a connection may sit idle inside an open transaction before PostgreSQL ends it.
# A worker that freezes mid-transaction then can't hold the invoice counter lock forever.
invoicekit.database.idle-in-transaction-timeout=30s

# Runs on every new pooled connection, so each session gets the timeout above.
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = '${invoicekit.database.idle-in-transaction-timeout}'
