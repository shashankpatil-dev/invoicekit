# Invoice number allocation.

# How long a worker waits for a series' counter lock. It then fails, rolls back and Kafka redelivers.
invoicekit.numbering.lock-timeout=2s

# How long any statement in a numbering transaction may run, so a slow one can't hold locks.
invoicekit.numbering.statement-timeout=5s

# Share of a series' yearly capacity that raises the utilisation alert.
invoicekit.numbering.utilisation-warning=0.8
