# Connection to the Typst renderer service.
invoicekit.render.url=${TYPST_RENDERER_URL:http://localhost:3002}

# Stays below the renderer's 30 second limit, so the client fails first and can retry.
invoicekit.render.timeout=25s

# How many renders one Java worker sends at once.
invoicekit.render.max-concurrency=4

# How long a Redis render lease lasts.
invoicekit.render.lease-ttl=120s
