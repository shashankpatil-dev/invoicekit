# One k6 load test phase. loadtest/kind/run.sh fills in the __PLACEHOLDER__ values.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-__PHASE__
  namespace: fp
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          imagePullPolicy: Never
          args: ["run", "--quiet", "--no-usage-report", "/scripts/render.js"]
          env:
            - name: RENDERER_URL
              value: http://document-engine:3000
            - name: PHASE
              value: __PHASE__
            - name: RATE
              value: "__RATE__"
            - name: DURATION
              value: __DURATION__
            - name: STAGES
              value: "__STAGES__"
            # Job pods have no shared disk, so results are read from the pod log.
            - name: SUMMARY_TO_STDOUT
              value: "true"
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: payloads
              mountPath: /payloads
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
        - name: payloads
          configMap:
            name: k6-payloads
