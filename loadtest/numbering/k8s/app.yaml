# InvoiceKit with the loadtest profile, which serves /loadtest/orders.
# run.sh sets the replica count and HIKARI_POOL_SIZE for each phase.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numbering
  namespace: numbering
  labels:
    app: numbering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: numbering
  template:
    metadata:
      labels:
        app: numbering
    spec:
      containers:
        - name: numbering
          image: invoicekit/numbering-loadtest:loadtest
          imagePullPolicy: Never
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/invoicekit
            - name: DB_USERNAME
              value: invoicekit
            - name: DB_PASSWORD
              value: invoicekit
            - name: HIKARI_POOL_SIZE
              value: "10"
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: numbering
  namespace: numbering
spec:
  selector:
    app: numbering
  ports:
    - port: 8081
