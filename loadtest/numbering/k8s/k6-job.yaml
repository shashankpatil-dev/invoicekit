# One k6 phase of the numbering load test. loadtest/numbering/run.sh fills in the __PLACEHOLDER__ values.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-__PHASE__
  namespace: numbering
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          imagePullPolicy: Never
          args: ["run", "--quiet", "--no-usage-report", "/scripts/numbering.js"]
          env:
            - name: APP_URL
              value: http://numbering:8081
            - name: PHASE
              value: __PHASE__
            - name: BUSINESS_UNIT
              value: __BUSINESS_UNIT__
            - name: RATE
              value: "__RATE__"
            - name: DURATION
              value: __DURATION__
            - name: STAGES
              value: "__STAGES__"
            # Job pods have no shared disk, so results are read from the pod log.
            - name: SUMMARY_TO_STDOUT
              value: "true"
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-numbering
